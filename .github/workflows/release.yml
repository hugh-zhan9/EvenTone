name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      label: ${{ steps.metadata.outputs.label }}
      publish: ${{ steps.metadata.outputs.publish }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        run: python3 scripts/release_metadata.py >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          ./scripts/test.sh
          python3 -B -m unittest discover -s Tests/ReleaseTests -v
      - name: Compile with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Build app and package
        env:
          VERSION_LABEL: ${{ steps.metadata.outputs.label }}
        run: |
          test "$(uname -m)" = arm64
          ./scripts/build.sh
          python3 -B -m unittest discover -s Tests/PackageTests -v
          ./scripts/package.sh dist/EvenTone.app dist/release "$VERSION_LABEL"
          ditto -x -k "dist/release/EvenTone-${VERSION_LABEL}-macOS-arm64.zip" "$RUNNER_TEMP/package-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/package-check/EvenTone.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EvenTone-${{ steps.metadata.outputs.label }}-macOS-arm64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EvenTone-${{ needs.build.outputs.label }}-macOS-arm64
          path: release
      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          VERSION_LABEL: ${{ needs.build.outputs.label }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS.txt
          cat > release-notes.md <<EOF
          macOS 14.2+ · Apple Silicon (arm64)

          下载 ZIP 并解压得到 EvenTone.app。此构建使用临时签名，尚未经过 Developer ID 公证；macOS 可能阻止打开，首次处理音频需要系统授权。

          源码提交：$GITHUB_SHA
          构建记录：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          SHA256SUMS.txt 可用于校验下载文件。
          EOF
          python3 -B ../scripts/publish_release.py .
